services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: blockout
      POSTGRES_PASSWORD: blockout
      POSTGRES_DB: blockout
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - blockout-database:/var/lib/postgresql/data

  certbot:
    image: certbot/dns-route53
    volumes:
      - letsencrypt:/etc/letsencrypt
      - haproxy-certs:/haproxy-certs
      - ./certbot-entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: "no"

  nextjs:
    build: ui
    env_file:
      - ./ui/.env
    depends_on:
      - postgres
    volumes:
      - .:/application
    entrypoint: ["/bin/sh", "/application/ui/entrypoint.sh"]
    logging:
      driver: none

  haproxy:
    image: haproxy:latest
    ports:
      - "15443:15443"
    volumes:
      - haproxy-certs:/etc/haproxy/certs
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      certbot:
        condition: service_completed_successfully
      nextjs:
        condition: service_started
    restart: unless-stopped

volumes:
  blockout-database:
  letsencrypt:
  haproxy-certs:
